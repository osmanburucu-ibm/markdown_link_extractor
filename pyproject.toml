[project]
name = "markdown_link_extractor"
version = "0.1.0"
description = "Extract and organize links from Markdown files."
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
md-links = "markdown_link_extractor.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
